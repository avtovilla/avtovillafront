    <style>
        /* --- СТИЛИ ПРЕМИАЛЬНОГО СЛАЙДЕРА ГАЛЕРЕИ --- */
        .premium-gallery-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border-radius: 16px;
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .gallery-track-wrapper {
            position: relative;
            width: 100%;
            height: 520px;
        }

        .gallery-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transform: scale(1.02);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 12, 16, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-nav-arrow:hover {
            background: #0074d9;
            transform: translateY(-50%) scale(1.08);
        }

        .gallery-nav-arrow.btn-prev { left: 25px; }
        .gallery-nav-arrow.btn-next { right: 25px; }

        /* --- СТИЛИ ПАНЕЛИ ДЕЙСТВИЙ --- */
        .action-bar-container { width: 100%; background: #06080c; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .action-bar { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; padding: 5px 10px; }
        .action-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8a99ad; gap: 6px; transition: color 0.3s; cursor: pointer; }
        .action-item:hover { color: #fff; }
        .action-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.3s; }
        .action-item:hover .action-icon { transform: scale(1.1); }
        .icon-2gis { background: #28a745; }
        .icon-wa { background: #25d366; }
        .icon-discount { background: #dc3545; }
        .icon-phone { background: #0074d9; }
        .action-text { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .action-divider { width: 1px; height: 30px; background: rgba(255, 255, 255, 0.1); }
    </style>
